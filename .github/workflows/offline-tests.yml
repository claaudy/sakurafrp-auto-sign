name: Offline tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked
      - name: Run offline tests
        run: uv run python -m unittest
